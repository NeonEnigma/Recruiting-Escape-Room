<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glückwunsch · Escape Bewerbung</title>
  <link rel="stylesheet" href="css/fiori.css" />
  <style>
    .success-wrap {
      width: 100%;
      max-width: 480px;
      padding: 0 1rem;
      text-align: center;
    }
    .success-icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
      display: block;
      animation: pop 0.5s cubic-bezier(0.175,0.885,0.32,1.275) both;
    }
    @keyframes pop {
      from { transform: scale(0.5); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
    .success-title {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }
    .success-sub {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.6;
    }
    .confetti-bar {
      height: 4px;
      background: linear-gradient(90deg, var(--brand), #8b5cf6, #22c55e, var(--brand));
      background-size: 200% 100%;
      border-radius: 2px;
      margin: 1.75rem 0 0;
      animation: slide 3s linear infinite;
    }
    @keyframes slide {
      from { background-position: 0% center; }
      to   { background-position: 200% center; }
    }
  </style>
</head>
<body>
  <div class="fiori-shell">
    <img src="img/logo.png" alt="SAP Escape" class="shell-logo-img" />
    <span class="shell-spacer"></span>
    <button class="shell-logout" onclick="logout()">Abmelden</button>
  </div>
  <div class="center-page" style="min-height:calc(100vh - 3.25rem)">
    <div class="success-wrap">
      <span class="success-icon">🎉</span>
      <div class="fiori-card">
        <h2 class="success-title">Glückwunsch!</h2>
        <p class="success-sub">Du hast das Rätsel erfolgreich gelöst.<br>Wir melden uns bald bei dir.</p>
        <div class="confetti-bar"></div>
      </div>
    </div>
  </div>
  <script>
    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('role');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
