<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anmelden · Escape Bewerbung</title>
  <link rel="stylesheet" href="css/fiori.css" />
  <style>
    .login-wrap {
      width: 100%;
      max-width: 400px;
      padding: 0 1rem;
    }
    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }
    .login-brand-icon {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, var(--brand), #8b5cf6);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 0 32px var(--brand-glow);
    }
    .login-brand h1 {
      font-size: 1.375rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .login-brand p {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: -0.25rem;
    }
    .login-footer {
      margin-top: 1.25rem;
      text-align: center;
      font-size: 0.8125rem;
      color: var(--text-subtle);
    }
    .login-footer a {
      color: var(--brand);
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
    }
    .login-footer a:hover { text-decoration: underline; }

    /* Forgot-password modal */
    .forgot-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .forgot-backdrop.open { display: flex; }
    .forgot-modal {
      background: #161b27;
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      padding: 2rem;
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    .forgot-modal h3 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 0.625rem;
      color: var(--text);
    }
    .forgot-modal p {
      font-size: 0.875rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .forgot-close {
      width: 100%;
      height: 2.25rem;
      border-radius: 8px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.09);
      color: var(--text-muted);
      cursor: pointer;
      font-family: var(--font);
      font-size: 0.875rem;
      font-weight: 500;
      transition: background 0.12s;
    }
    .forgot-close:hover { background: rgba(255,255,255,0.1); color: var(--text); }

    .btn-primary { font-size: 0.9375rem; height: 2.75rem; }

    .role-opt {
      flex: 1;
      padding: 0.625rem 0.5rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border-input);
      border-radius: 8px;
      color: var(--text-muted);
      font-family: var(--font);
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .role-opt:hover { border-color: var(--brand); }
    .role-opt.active {
      background: rgba(99,102,241,0.15);
      border-color: var(--brand);
      color: var(--text);
    }
  </style>
</head>
<body class="center-page">
  <div class="login-wrap">
    <div class="login-brand">
    </div>

    <!-- Remaining time only (no location name) -->
    <div id="locationBar" style="display:flex;align-items:center;justify-content:center;gap:0.5rem;padding:0.75rem 1rem;margin-bottom:1.25rem;background:rgba(99,102,241,0.07);border:1px solid rgba(99,102,241,0.2);border-radius:8px;font-size:0.875rem;color:var(--text-muted)">
      ⏱ <span id="locTime" style="font-variant-numeric:tabular-nums;font-weight:700;font-size:1.125rem;color:var(--text)">--:--</span>
    </div>

    <div class="fiori-card">
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Benutzername</label>
          <input type="text" id="username" autocomplete="username"
            placeholder="John oder Spectator" autofocus />
        </div>

        <div class="form-group" style="margin-bottom:0.75rem">
          <label for="password">Passwort</label>
          <input type="password" id="password" name="password"
            placeholder="••••••••"
            autocomplete="current-password" />
        </div>

        <div class="error-msg" id="errorMsg"></div>

        <button type="submit" class="btn btn-primary btn-full" style="margin-top:1.25rem">
          Anmelden →
        </button>
      </form>
    </div>

    <div class="login-footer">
      <a onclick="openUnlock()" style="cursor:pointer">Standort ändern</a>
    </div>
  </div>

  <!-- Unlock modal for changing location (spectator or admin password) -->
  <div id="unlockBackdrop" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center;padding:1rem">
    <div style="background:#161b27;border:1px solid var(--border);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,0.5);padding:2rem;width:100%;max-width:360px">
      <h3 style="font-size:1rem;font-weight:700;margin-bottom:0.625rem">Standort ändern</h3>
      <div style="display:flex;align-items:center;gap:0.5rem;padding:0.625rem 0.875rem;margin-bottom:1rem;background:rgba(99,102,241,0.07);border:1px solid rgba(99,102,241,0.2);border-radius:8px;font-size:0.875rem">
        <span style="color:var(--text-muted)">Aktueller Standort:</span>
        <strong id="unlockCurrentLoc">—</strong>
      </div>
      <p style="font-size:0.8125rem;color:var(--text-muted);line-height:1.6;margin-bottom:1.25rem">
        Bitte gib das Beobachter- oder Admin-Passwort ein, um den Standort zu wechseln.
      </p>
      <input type="password" id="unlockPw" placeholder="Passwort" autocomplete="off"
        style="width:100%;height:2.5rem;padding:0 0.875rem;background:rgba(255,255,255,0.05);border:1px solid var(--border-input);border-radius:8px;color:var(--text);font-family:var(--font);font-size:0.9375rem;outline:none" />
      <div class="error-msg" id="unlockError"></div>
      <div style="display:flex;gap:0.75rem;justify-content:flex-end;margin-top:1.25rem">
        <button type="button" class="btn btn-ghost" onclick="closeUnlock()">Abbrechen</button>
        <button type="button" class="btn btn-primary" onclick="confirmUnlock()">Weiter</button>
      </div>
    </div>
  </div>

  <script>
    // Require a chosen location before login
    const locationId = localStorage.getItem('location_id');
    if (!locationId) window.location.href = 'location.html';

    function fmtTime(ms) {
      const s = Math.max(0, Math.floor(ms / 1000));
      return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    }

    // Poll the location's remaining time
    async function pollTimer() {
      const res = await fetch('/api/timer/' + locationId);
      if (!res.ok) return;
      const t = await res.json();
      document.getElementById('locTime').textContent = fmtTime(t.remaining_ms);
    }
    pollTimer();
    setInterval(pollTimer, 1500);

    // ── Change location (protected by spectator/admin password) ──
    function openUnlock() {
      document.getElementById('unlockPw').value = '';
      document.getElementById('unlockError').textContent = '';
      document.getElementById('unlockCurrentLoc').textContent = localStorage.getItem('location_name') || '—';
      document.getElementById('unlockBackdrop').style.display = 'flex';
      document.getElementById('unlockPw').focus();
    }
    function closeUnlock() {
      document.getElementById('unlockBackdrop').style.display = 'none';
    }
    async function confirmUnlock() {
      const pw = document.getElementById('unlockPw').value;
      const err = document.getElementById('unlockError');
      err.textContent = '';
      const res = await fetch('/api/verify-unlock', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ location_id: parseInt(locationId), password: pw })
      });
      if (!res.ok) { err.textContent = 'Falsches Passwort.'; return; }
      localStorage.removeItem('location_id');
      localStorage.removeItem('location_name');
      window.location.href = 'location.html';
    }
    document.getElementById('unlockPw').addEventListener('keydown', e => { if (e.key === 'Enter') confirmUnlock(); });

    // Decide where a user should go based on role + puzzle progress
    function redirectFor(role, p) {
      if (role === 'admin') return 'admin.html';
      if (role === 'spectator') return 'spectator.html';
      if (p.p_ai === 'solved') return 'dashboard-player.html';
      if (p.p_dev === 'solved') return 'ai.html';
      if (p.p_timed === 'solved') return 'scratch.html';
      return 'intro.html';
    }

    // If already logged in, fetch fresh state and redirect
    if (localStorage.getItem('token')) {
      (async () => {
        const token = localStorage.getItem('token');
        const res = await fetch('/api/me', { headers: { 'Authorization': 'Bearer ' + token } });
        if (!res.ok) { localStorage.removeItem('token'); localStorage.removeItem('role'); return; }
        const u = await res.json();
        window.location.href = redirectFor(u.role, u);
      })();
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      const btn = e.target.querySelector('button[type=submit]');
      errorMsg.textContent = '';
      btn.textContent = '…';
      btn.disabled = true;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, location_id: parseInt(locationId), password })
        });
        const data = await res.json();

        if (!res.ok) {
          errorMsg.textContent = data.error || 'Anmeldung fehlgeschlagen.';

          btn.textContent = 'Anmelden →';
          btn.disabled = false;
          return;
        }

        localStorage.setItem('token', data.token);
        localStorage.setItem('role', data.role);
        window.location.href = redirectFor(data.role, data);
      } catch {
        errorMsg.textContent = 'Server nicht erreichbar.';
        btn.textContent = 'Anmelden →';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
