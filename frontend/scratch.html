<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Programmieraufgabe · Escape Bewerbung</title>
  <link rel="stylesheet" href="css/fiori.css" />
  <style>
    .dev-wrap {
      width: 100%;
      max-width: 560px;
      padding: 0 1rem;
      text-align: center;
    }
    .dev-placeholder {
      font-size: 1.0625rem;
      color: var(--text-muted);
      line-height: 1.7;
      padding: 2.5rem 1rem;
      margin-bottom: 2rem;
    }
    .btn-primary { height: 2.75rem; font-size: 0.9375rem; }
  </style>
</head>
<body>
  <div class="fiori-shell">
    <img src="img/logo.png" alt="SAP Escape" class="shell-logo-img" />
    <span class="shell-spacer"></span>
    <span id="hdrTimer" style="font-variant-numeric:tabular-nums;font-weight:700;font-size:0.9375rem;padding:0.2rem 0.625rem;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:6px;margin-right:0.75rem">--:--</span>
    <button class="shell-logout" onclick="logout()">Abmelden</button>
  </div>
  <div class="center-page" id="pageContent" style="visibility:hidden;min-height:calc(100vh - 3.25rem)">
    <div class="dev-wrap">
    <div class="fiori-card">
      <div class="dev-placeholder">
        Hier kommt die Programmieraufgabe hin.
      </div>
      <button id="nextBtn" class="btn btn-primary btn-full">Weiter →</button>
    </div>
  </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'index.html';

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('role');
      window.location.href = 'index.html';
    }

    async function setProgress(puzzle, status) {
      await fetch('/api/puzzle/progress', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ puzzle, status })
      });
    }

    // Guard: skip if already solved
    (async () => {
      const res = await fetch('/api/me', { headers: { 'Authorization': 'Bearer ' + token } });
      if (!res.ok) { window.location.href = 'index.html'; return; }
      const user = await res.json();
      if (user.p_dev === 'solved') {
        window.location.href = 'ai.html';
        return;
      }
      await setProgress('dev', 'started');
      document.getElementById('pageContent').style.visibility = 'visible';
      startLocationTimer(user.location_id);
    })();

    // ── Location countdown in header ──
    function startLocationTimer(locId) {
      if (!locId) return;
      const el = document.getElementById('hdrTimer');
      const tick = async () => {
        const r = await fetch('/api/timer/' + locId);
        if (!r.ok) return;
        const t = await r.json();
        const s = Math.max(0, Math.floor(t.remaining_ms / 1000));
        el.textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
        el.style.color = t.remaining_ms <= 60000 ? '#f87171' : '';
        if (t.state === 'finished') return;
        if (t.remaining_ms <= 0) { window.location.href = 'timeout.html'; return; }
        if (t.state !== 'running') { window.location.href = 'paused.html'; return; }
      };
      tick();
      setInterval(tick, 1000);
    }

    document.getElementById('nextBtn').addEventListener('click', async () => {
      const btn = document.getElementById('nextBtn');
      btn.disabled = true;
      btn.textContent = '…';
      await setProgress('dev', 'solved');
      window.location.href = 'ai.html';
    });
  </script>
</body>
</html>
