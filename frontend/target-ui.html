<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ziel-Interface</title>
  <link rel="stylesheet" href="css/fiori.css" />
  <style>
    .target-wrap {
      width: 100%;
      max-width: 480px;
      padding: 0 1rem;
    }
    .fiori-card h2 {
      font-size: 1.125rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .fiori-card .subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }
    #activateBtn {
      width: 100%;
      opacity: 0.35;
      pointer-events: none;
      cursor: not-allowed;
    }
    #activateBtn.enabled {
      opacity: 1;
      pointer-events: all;
      cursor: pointer;
    }
    .status-hint {
      margin-top: 1.25rem;
      text-align: center;
      font-size: 0.8125rem;
      color: var(--text-subtle);
    }
  </style>
</head>
<body class="center-page">
  <div class="target-wrap">
    <div class="fiori-card">
      <h2>System aktivieren</h2>
      <p class="subtitle">Dieser Button ist aktuell deaktiviert. Bring ihn zum Funktionieren.</p>

      <button id="activateBtn" class="btn btn-primary btn-full" disabled>
        Aktivieren
      </button>

      <p class="status-hint" id="statusHint">Warte auf Aktivierung durch das Scratch-Tool…</p>
    </div>
  </div>

  <script>
    // This page listens for a postMessage from the scratch tool
    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'ENABLE_BUTTON') {
        const btn = document.getElementById('activateBtn');
        btn.disabled = false;
        btn.classList.add('enabled');
        document.getElementById('statusHint').textContent = 'Button ist jetzt aktiv. Klicke ihn!';
      }
    });

    document.getElementById('activateBtn').addEventListener('click', async () => {
      const token = localStorage.getItem('token');
      if (token) {
        await fetch('/api/puzzle/solved', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }
        });
        localStorage.setItem('puzzle_solved', '1');
      }
      // Notify the scratch window and redirect both
      if (window.opener) {
        window.opener.postMessage({ type: 'PUZZLE_SOLVED' }, '*');
      }
      window.location.href = 'dashboard-player.html';
    });
  </script>
</body>
</html>
