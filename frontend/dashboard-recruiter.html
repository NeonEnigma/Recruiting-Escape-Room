<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recruiter Dashboard · Escape Bewerbung</title>
  <link rel="stylesheet" href="css/fiori.css" />
  <style>
    .recruiter-wrap {
      width: 100%;
      max-width: 480px;
      padding: 0 1rem;
      text-align: center;
    }
    .recruiter-icon {
      font-size: 3.5rem;
      margin-bottom: 1.5rem;
      display: block;
    }
    .recruiter-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }
    .recruiter-sub {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.6;
    }
    .solved-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1.5rem;
      padding: 0.5rem 1.25rem;
      background: rgba(34,197,94,0.1);
      border: 1px solid rgba(34,197,94,0.25);
      border-radius: 999px;
      color: #4ade80;
      font-size: 0.875rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="fiori-shell">
    <img src="img/logo.png" alt="SAP Escape" class="shell-logo-img" />
    <span class="shell-spacer"></span>
    <button class="shell-logout" onclick="logout()">Abmelden</button>
  </div>
  <div class="center-page" style="min-height:calc(100vh - 3.25rem)">
    <div class="recruiter-wrap">
      <span class="recruiter-icon">✅</span>
      <div class="fiori-card">
        <h2 class="recruiter-title">Rätsel gelöst!</h2>
        <p class="recruiter-sub">Der Bewerber hat den Button erfolgreich aktiviert.</p>
        <div>
          <span class="solved-badge">
            <span class="status-dot dot-green"></span>
            Puzzle erfolgreich abgeschlossen
          </span>
        </div>
      </div>
    </div>
  </div>
  <script>
    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('role');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
