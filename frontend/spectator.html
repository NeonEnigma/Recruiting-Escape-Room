<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beobachter · Escape Bewerbung</title>
  <link rel="stylesheet" href="css/fiori.css" />
  <style>
    body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* Puzzle badges in the header */
    .hdr-puzzles {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .hdr-puzzle {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.2rem 0.625rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      color: var(--text-subtle);
      transition: all 0.2s;
    }
    .hdr-puzzle .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--text-subtle);
    }
    .hdr-puzzle.started {
      background: rgba(251,191,36,0.12);
      color: #fbbf24;
      border-color: rgba(251,191,36,0.3);
    }
    .hdr-puzzle.started .dot { background: #fbbf24; }
    .hdr-puzzle.solved {
      background: rgba(34,197,94,0.12);
      color: #4ade80;
      border-color: rgba(34,197,94,0.3);
    }
    .hdr-puzzle.solved .dot { background: var(--success); box-shadow: 0 0 6px rgba(34,197,94,0.6); }

    .spec-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem 1rem;
      overflow: hidden;
    }
    .spec-banner {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8125rem;
      color: var(--text-subtle);
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.625rem 0.875rem;
      margin-bottom: 1rem;
      flex-shrink: 0;
    }
    .spec-live-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--danger);
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    .spec-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .stage-view {
      margin: auto;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    /* Timer control in header */
    .timer-control {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-right: 0.75rem;
    }
    .timer-display {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      font-size: 1rem;
      color: var(--text);
      min-width: 3.2rem;
      text-align: center;
      padding: 0.15rem 0.5rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .timer-display.urgent { color: #f87171; border-color: rgba(248,113,113,0.4); }
    .tc-btn {
      width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.75rem;
      transition: all 0.12s;
    }
    .tc-btn:hover { background: rgba(99,102,241,0.15); color: var(--text); border-color: var(--brand); }
    .tc-btn.wide { width: auto; padding: 0 0.7rem; gap: 0.35rem; font-weight: 600; font-size: 0.8125rem; }
    .tc-btn.danger { color: #f87171; }
    .tc-btn.danger:hover { background: rgba(248,113,113,0.15); border-color: rgba(248,113,113,0.5); }

    /* Big pre-start control panel */
    .start-panel {
      margin: auto;
      max-width: 460px;
      width: 100%;
      text-align: center;
    }
    .start-panel .big-timer {
      font-variant-numeric: tabular-nums;
      font-size: 3.5rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    .start-panel .timer-hint {
      font-size: 0.8125rem;
      color: var(--text-subtle);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 1.75rem;
    }
    .btn-start-big {
      width: 100%;
      height: 3.25rem;
      font-size: 1.0625rem;
      font-weight: 700;
      margin-bottom: 1.75rem;
    }
    .puzzle-status-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .ps-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.7rem 1rem;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9375rem;
    }
    .ps-badge {
      font-size: 0.75rem; font-weight: 600;
      padding: 0.15rem 0.6rem; border-radius: 999px;
      border: 1px solid;
    }
    .ps-badge.none    { background: rgba(255,255,255,0.04); color: var(--text-subtle); border-color: var(--border); }
    .ps-badge.started { background: rgba(251,191,36,0.12); color: #fbbf24; border-color: rgba(251,191,36,0.3); }
    .ps-badge.solved  { background: rgba(34,197,94,0.12); color: #4ade80; border-color: rgba(34,197,94,0.3); }
    .adjust-row { display: flex; gap: 0.4rem; justify-content: center; margin-bottom: 1.25rem; }
    .adjust-btn {
      padding: 0.4rem 0.8rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-muted);
      cursor: pointer;
      font-family: var(--font);
      font-size: 0.8125rem;
      font-weight: 600;
      transition: all 0.12s;
    }
    .adjust-btn:hover { background: rgba(99,102,241,0.15); color: var(--text); border-color: var(--brand); }

    /* Confirm modal */
    .confirm-backdrop {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
      z-index: 200; align-items: center; justify-content: center; padding: 1rem;
    }
    .confirm-backdrop.open { display: flex; }
    .confirm-modal {
      background: #161b27; border: 1px solid var(--border);
      border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      padding: 2rem; width: 100%; max-width: 380px;
    }
    .confirm-modal h3 { font-size: 1.0625rem; font-weight: 700; margin-bottom: 0.75rem; }
    .confirm-modal p { font-size: 0.9375rem; color: var(--text-muted); line-height: 1.6; }
  </style>
</head>
<body>
  <div class="fiori-shell">
    <img src="img/logo.png" alt="SAP Escape" class="shell-logo-img" />
    <span class="shell-suffix" style="margin-left:0.75rem">Beobachter</span>
    <div class="hdr-puzzles" style="margin-left:1rem">
      <span class="hdr-puzzle" id="badgeTimed"><span class="dot"></span>Timed</span>
      <span class="hdr-puzzle" id="badgeDev"><span class="dot"></span>Dev</span>
      <span class="hdr-puzzle" id="badgeAi"><span class="dot"></span>AI</span>
    </div>
    <span class="shell-spacer"></span>
    <div class="timer-control" id="timerControl">
      <span class="timer-display" id="timerDisplay">--:--</span>
      <button class="tc-btn" onclick="adjustTimer(-5)" title="-5 Minuten">−5</button>
      <button class="tc-btn" onclick="adjustTimer(5)" title="+5 Minuten">+5</button>
      <button class="tc-btn wide" id="toggleBtn" onclick="toggleTimer()" title="Start/Pause">▶ Start</button>
      <button class="tc-btn danger" onclick="confirmStop()" title="Stopp">⏹</button>
    </div>
    <button class="shell-logout" onclick="logout()">Abmelden</button>
  </div>

  <!-- Stop confirmation modal -->
  <div class="confirm-backdrop" id="stopBackdrop">
    <div class="confirm-modal">
      <h3>Timer stoppen?</h3>
      <p>Möchtest du den Timer wirklich stoppen? Der Timer wird auf 30:00 zurückgesetzt und der gesamte Rätsel-Fortschritt gelöscht.</p>
      <div style="display:flex;gap:0.75rem;justify-content:flex-end;margin-top:1.5rem">
        <button class="btn btn-ghost" onclick="closeStop()">Abbrechen</button>
        <button class="btn btn-danger" onclick="doStop()">Stoppen</button>
      </div>
    </div>
  </div>

  <div class="spec-body" id="specBody" style="visibility:hidden">
    <div class="spec-banner">
      <span class="spec-live-dot"></span>
      <span>Live-Ansicht von <strong id="playerName">…</strong></span>
    </div>
    <div class="spec-view" id="specView"></div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'index.html';

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('role');
      window.location.href = 'index.html';
    }

    const authHeader = { 'Authorization': 'Bearer ' + token };
    let myLocationId = null;
    let spectatesId = null;    // the player this spectator watches
    let latestTarget = null;   // { username, p_timed, p_dev, p_ai }
    let latestTimer = { state: 'idle', remaining_ms: 1800000 };
    let renderedKey = null;    // to avoid re-rendering the same view

    function fmtTime(ms) {
      const s = Math.max(0, Math.floor(ms / 1000));
      return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c =>
        ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
    function badgeClass(status) { return status === 'solved' ? 'solved' : status === 'started' ? 'started' : 'none'; }
    function badgeText(status)  { return status === 'solved' ? 'Gelöst' : status === 'started' ? 'Läuft' : 'Offen'; }

    // Update the three header badges
    function setBadge(el, status) {
      el.classList.remove('started', 'solved');
      if (status === 'started') el.classList.add('started');
      else if (status === 'solved') el.classList.add('solved');
    }

    // ── Header timer control ──
    function updateHeaderControl() {
      const disp = document.getElementById('timerDisplay');
      disp.textContent = fmtTime(latestTimer.remaining_ms);
      const finished = latestTimer.state === 'finished';
      disp.classList.toggle('urgent', !finished && latestTimer.remaining_ms <= 60000);
      disp.style.color = finished ? '#4ade80' : '';
      const toggle = document.getElementById('toggleBtn');
      if (finished) {
        toggle.textContent = '✓ Beendet';
        toggle.disabled = true;
        toggle.style.opacity = '0.5';
      } else {
        toggle.disabled = false;
        toggle.style.opacity = '';
        toggle.textContent = latestTimer.state === 'running' ? '⏸ Pause' : '▶ Start';
      }
    }

    async function timerAction(action) {
      if (!myLocationId) return;
      const res = await fetch('/api/timer/' + myLocationId + '/' + action, { method: 'POST', headers: authHeader });
      if (res.ok) { latestTimer = await res.json(); updateHeaderControl(); refreshView(); }
    }
    function toggleTimer() {
      timerAction(latestTimer.state === 'running' ? 'pause' : 'start');
    }
    async function adjustTimer(minutes) {
      if (!myLocationId) return;
      const res = await fetch('/api/timer/' + myLocationId + '/adjust', {
        method: 'POST', headers: { ...authHeader, 'Content-Type': 'application/json' },
        body: JSON.stringify({ minutes })
      });
      if (res.ok) { latestTimer = await res.json(); updateHeaderControl(); refreshView(); }
    }

    // Stop confirmation
    function confirmStop() { document.getElementById('stopBackdrop').classList.add('open'); }
    function closeStop()   { document.getElementById('stopBackdrop').classList.remove('open'); }
    async function doStop() { closeStop(); await timerAction('reset'); }
    document.getElementById('stopBackdrop').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeStop();
    });

    // ── Main view ──

    // When the timer is not running/finished, show the pre-start / control panel.
    // When it is running, just show which puzzle the player is currently solving.
    function refreshView() {
      const t = latestTarget;
      if (!t) return;
      const running = latestTimer.state === 'running';
      const finished = latestTimer.state === 'finished';

      const stage = running ? currentStage(t) : 'panel';
      const progress = t.p_timed + '|' + t.p_dev + '|' + t.p_ai;
      const key = finished
        ? 'finished'
        : (running ? ('stage:' + stage) : ('panel:' + latestTimer.state + ':' + progress));
      if (key === renderedKey) return;
      renderedKey = key;

      const view = document.getElementById('specView');

      if (finished) {
        view.innerHTML = `<div class="stage-view">Alle Rätsel gelöst</div>`;
        return;
      }
      if (!running) {
        renderStartPanel(t);
        return;
      }

      const label = {
        timed: 'Timed-Rätsel',
        dev:   'Dev-Rätsel',
        ai:    'AI-Rätsel',
        done:  'Alle Rätsel gelöst',
        ready: 'Bereit'
      }[stage] || stage;
      view.innerHTML = `<div class="stage-view">${label}</div>`;
    }

    // Pre-start control panel shown while the timer is not running
    function renderStartPanel(t) {
      const view = document.getElementById('specView');
      const touched = t.p_timed !== 'none' || t.p_dev !== 'none' || t.p_ai !== 'none';
      const stateLabel = { idle:'Bereit', paused:'Pausiert', stopped:'Gestoppt' }[latestTimer.state] || latestTimer.state;
      view.innerHTML = `
        <div class="start-panel">
          <div class="big-timer" ${latestTimer.remaining_ms <= 60000 ? 'style="color:#f87171"' : ''}>${fmtTime(latestTimer.remaining_ms)}</div>
          <div class="timer-hint">${stateLabel} – Spieler kann sich noch nicht anmelden</div>

          <button class="btn btn-primary btn-start-big" onclick="timerAction('start')">▶ Timer starten</button>

          <div class="adjust-row">
            <button class="adjust-btn" onclick="adjustTimer(-5)">−5 Min</button>
            <button class="adjust-btn" onclick="adjustTimer(5)">+5 Min</button>
          </div>

          <div class="puzzle-status-list">
            <div class="ps-row"><span>Timed</span><span class="ps-badge ${badgeClass(t.p_timed)}">${badgeText(t.p_timed)}</span></div>
            <div class="ps-row"><span>Dev</span><span class="ps-badge ${badgeClass(t.p_dev)}">${badgeText(t.p_dev)}</span></div>
            <div class="ps-row"><span>AI</span><span class="ps-badge ${badgeClass(t.p_ai)}">${badgeText(t.p_ai)}</span></div>
          </div>

          <button class="btn btn-ghost" style="width:100%;${touched ? '' : 'opacity:0.45;cursor:not-allowed'}"
            onclick="${touched ? 'resetProgress()' : ''}" ${touched ? '' : 'disabled'}>
            Fortschritt zurücksetzen
          </button>
        </div>`;
    }

    async function resetProgress() {
      await timerAction('reset');  // reset also clears player progress + chat on the backend
    }

    // Figure out which puzzle the player is currently on
    function currentStage(t) {
      if (t.p_ai === 'solved') return 'done';
      if (t.p_dev === 'solved') return 'ai';
      if (t.p_timed === 'solved') return 'dev';
      if (t.p_timed === 'started') return 'timed';
      return 'ready';
    }

    // ── Polling ──
    async function pollAll() {
      // Target (player status)
      const tRes = await fetch('/api/spectator/target', { headers: authHeader });
      if (!tRes.ok) { if (tRes.status === 403) window.location.href = 'index.html'; return; }
      latestTarget = await tRes.json();
      document.getElementById('playerName').textContent = latestTarget.username;
      setBadge(document.getElementById('badgeTimed'), latestTarget.p_timed);
      setBadge(document.getElementById('badgeDev'), latestTarget.p_dev);
      setBadge(document.getElementById('badgeAi'), latestTarget.p_ai);

      // Timer
      if (myLocationId) {
        const tmRes = await fetch('/api/timer/' + myLocationId);
        if (tmRes.ok) latestTimer = await tmRes.json();
      }
      updateHeaderControl();
      refreshView();
    }

    // Init: verify spectator role, then start polling
    (async () => {
      const res = await fetch('/api/me', { headers: authHeader });
      if (!res.ok) { window.location.href = 'index.html'; return; }
      const me = await res.json();
      if (me.role !== 'spectator') { window.location.href = 'index.html'; return; }
      myLocationId = me.location_id;
      spectatesId = me.spectates_id;
      document.getElementById('specBody').style.visibility = 'visible';
      if (!myLocationId) document.getElementById('timerControl').style.display = 'none';
      await pollAll();
      setInterval(pollAll, 1500);
    })();
  </script>
</body>
</html>
